version: 1
updatedAt: '2026-07-08'
sourceOfTruth: true
notes:
- 字段字典主格式为 YAML。字段允许 unknown offset，先沉淀证据，再逐步确认。
- 'confidence: low/medium/high/confirmed。'
- 2026-07-07 live mitmweb：补录 1130、3940、3941、1008、6444、1012、3183+114c；多数为 strings_confirmed_fields_unknown，待可控动作 diff。
- 2026-07-07 live mitmweb：观察到尾部 fffc0000 的 27-byte 响应，疑似会话失效/被踢错误码；已停止代理并改走 pcap 被动方案。
- 2026-07-08 passive bridge100 pcap：去重补录 1003、1016、1800、6287、1114、111f、1025 的字段骨架；仅新增未收录接口，不重复 3110/1130/6200/1008/1012/6444。
- 2026-07-08 passive bridge100 pcap 增量：新增 6300、6260、1226、1214、1520(wire prepare)、1522(wire dispatch)、1280、1702；其中 1520/1522 是既有刷黄 1520030/1522030 逻辑的实包形态补录。
- 2026-07-08 passive bridge100 pcap 第二批增量：新增 1250、1200、1104、1406、1103、123f；修正 scanner 将 0755/0100/d12c 参数误判为 opcode 的情况。
- 2026-07-08 passive bridge100 pcap 第三批增量：新增 1229 error-only 样本；请求携带两个对象 id，响应 fffc0000。
- 2026-07-08 passive bridge100 pcap 第四批增量：新增 1170 排行榜字段骨架；修正 1229 为批量补兵/批量补满成功字段骨架，旧 fffc0000 作为失败样本。
- 2026-07-08 0x8004 JiangLing 修正：114-byte body 对齐原客户端 Lo/a.b6 common；body+0x03 是职业分类，body+0x27/0x28 是忠诚当前/上限，body+0x23 是最大统兵数 uint32，body+0x58 是状态。当前兵数/兵种不在 body 内，来自后续 Lo/a.S5 表 Pm/Qm；旧 body+0x67=兵种、body+0x2b=忠诚、body+0x23/0x25=当前/最大兵数均判定为误读。
